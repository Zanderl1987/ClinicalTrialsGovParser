name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[duckdb,dev]"

      # Integration tests hit the live ClinicalTrials.gov API and are skipped
      # unless CTGOV_INTEGRATION_TESTS is set, so CI stays green when the
      # upstream API is slow, rate-limiting, or returning 403 to cloud IPs.
      - name: Test
        run: pytest -v
