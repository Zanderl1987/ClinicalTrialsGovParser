[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaltrials-parser"
version = "0.1.0"
description = "Parse and extract clinical trial data from ClinicalTrials.gov API v2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["clinicaltrials", "clinical-trials", "nih", "api", "parser"]

authors = [
  {name = "ClinicalTrials.govParser"},
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "click>=8.1",
  "pyarrow>=14",
  "pandas>=2",
  "polars>=1.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.10"]
iceberg = ["pyiceberg[sql-sqlite]>=0.7"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
ctgov-parser = "clinicaltrials_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
