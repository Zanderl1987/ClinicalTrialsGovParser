[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaltrials-parser"
version = "0.1.0"
description = "Parse and extract clinical trial data from ClinicalTrials.gov API v2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["clinicaltrials", "clinical-trials", "nih", "api", "parser"]

authors = [
  {name = "Zanderl1987"},
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "click>=8.1",
  "pyarrow>=14",
  "polars>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.10"]
iceberg = ["pyiceberg[sql-sqlite]>=0.7", "duckdb>=0.10"]
aact = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8", "pyiceberg[sql-sqlite]>=0.7"]

[project.urls]
Homepage = "https://github.com/Zanderl1987/ClinicalTrialsGovParser"
Source = "https://github.com/Zanderl1987/ClinicalTrialsGovParser"
Tracker = "https://github.com/Zanderl1987/ClinicalTrialsGovParser/issues"
Documentation = "https://github.com/Zanderl1987/ClinicalTrialsGovParser#readme"

[project.scripts]
ctgov-parser = "clinicaltrials_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
